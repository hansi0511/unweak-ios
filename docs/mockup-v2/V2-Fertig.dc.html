<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>V2 Training gespeichert</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#EAF2F5;text-decoration:none}a:hover{color:#FFFFFF}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090C; color: #EAF2F5; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between"><a href="V2-Journey.dc.html" aria-label="Schließen" style="width: 44px; height: 44px; border: 1px solid #1E2A33; background: #0B1015; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<a href="V2-Teilen.dc.html" aria-label="Teilen" style="width: 44px; height: 44px; border: 1px solid #1E2A33; background: #0B1015; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 12v8h14v-8"></path></svg></a></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 8px">
<div style="width: 72px; height: 72px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 28px {{glow}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#07090C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg></div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.05">Pull Day geschafft</h1>
<div style="font-size: 15px; color: #9FB0BC">Mi, 11. Nov</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #1E2A33; background: #0B1015">
<div style="padding: 14px; text-align: center; border-right: 1px solid #1E2A33"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">36</div><div style="font-size: 13px; color: #9FB0BC">Minuten</div></div>
<div style="padding: 14px; text-align: center; border-right: 1px solid #1E2A33"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">4</div><div style="font-size: 13px; color: #9FB0BC">Übungen</div></div>
<div style="padding: 14px; text-align: center"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: {{accent}}">1</div><div style="font-size: 13px; color: #9FB0BC">Rekord</div></div>
</div>
<div style="padding: 14px; border: 1px solid {{accent}}; background: #111920; font-size: 16px; font-weight: 600">Neuer Rekord: <span style="color: {{accent}}">6 Klimmzüge</span></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Wie war's?</h2>
<div role="group" aria-label="Bewertung" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #3A4954; flex-shrink: 0">
<sc-for list="{{moods}}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="height: 44px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">{{m.name}}</button>
</sc-for>
</div>
</div>
<button type="button" style="height: 44px; align-self: flex-start; padding: 0; border: 0; background: transparent; color: #C3CED6; font-family: 'Inter', sans-serif; font-size: 15px; cursor: pointer">+ Notiz hinzufügen</button>
<div style="flex-grow: 1"></div>
<a href="V2-Journey.dc.html" style="height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 10px; background: {{accent}}; color: #07090C; box-shadow: 0 0 24px {{glow}}; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Speichern</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#5CE1FF","#FFB547","#FF7566","#FF7AB8","#A995FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mood: 'ok' }; }
renderVals() {
var accent = this.props.accent ?? '#C6F24E';
var glow = /^#[0-9a-fA-F]{6}$/.test(accent) ? accent + '66' : accent;
var self = this;
var st = this.state || {};
function seg(list, key, cur) {
return list.map(function (m) {
var on = m[1] === cur;
return { name: m[0], pressed: on ? 'true' : 'false', bg: on ? accent : 'transparent', fg: on ? '#07090C' : '#EAF2F5', pick: function () { var o = {}; o[key] = m[1]; self.setState(o); } };
});
}
return { accent: accent, glow: glow, moods: seg([['Leicht', 'easy'], ['Passt', 'ok'], ['Hart', 'hard']], 'mood', st.mood || 'ok') };
}
}
</script>
</body>
</html>
