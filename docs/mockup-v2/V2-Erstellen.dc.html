<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>V2 Neues Workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#EAF2F5;text-decoration:none}a:hover{color:#FFFFFF}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090C; color: #EAF2F5; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px">
<a href="V2-Workouts.dc.html" aria-label="Abbrechen" style="width: 44px; height: 44px; border: 1px solid #1E2A33; background: #0B1015; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.05">Neues Workout</h1>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="v2name" style="font-size: 15px; font-weight: 600">Name</label>
<input id="v2name" type="text" placeholder="Mein Workout" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #3A4954; background: #0B1015; color: #EAF2F5; font-family: 'Inter', sans-serif; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 15px; font-weight: 600">Bereich</div>
<div role="group" aria-label="Bereich" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid #3A4954; flex-shrink: 0">
<sc-for list="{{areas}}" as="m" hint-placeholder-count="4">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="height: 44px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">{{m.name}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 15px; font-weight: 600">Übungen</div><div style="font-size: 14px; color: #9FB0BC">{{summary}}</div></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; height: 56px; box-sizing: border-box; padding: 0 4px 0 14px; border: 1px solid #1E2A33; background: #0B1015">
<div style="flex-grow: 1; font-size: 16px; font-weight: 600">{{r.name}}</div>
<div style="font-size: 15px; color: #C3CED6">{{r.dose}}</div>
<button type="button" onClick="{{r.remove}}" aria-label="{{r.removeLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #9FB0BC; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
</div>
</sc-for>
<sc-if value="{{canAdd}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{add}}" style="height: 52px; border: 1px dashed {{accent}}; background: transparent; color: {{accent}}; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">+ Übung hinzufügen</button>
</sc-if>
</div>
<div style="flex-grow: 1"></div>
<a href="V2-Workouts.dc.html" style="height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 10px; background: {{accent}}; color: #07090C; box-shadow: 0 0 24px {{glow}}; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Speichern</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#5CE1FF","#FFB547","#FF7566","#FF7AB8","#A995FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { area: 'pull', picked: [0, 1, 2] }; }
renderVals() {
var accent = this.props.accent ?? '#C6F24E';
var glow = /^#[0-9a-fA-F]{6}$/.test(accent) ? accent + '66' : accent;
var self = this;
var st = this.state || {};
function seg(list, key, cur) {
return list.map(function (m) {
var on = m[1] === cur;
return { name: m[0], pressed: on ? 'true' : 'false', bg: on ? accent : 'transparent', fg: on ? '#07090C' : '#EAF2F5', pick: function () { var o = {}; o[key] = m[1]; self.setState(o); } };
});
}
var pool = [['Klimmzüge', '4 × 6'], ['Rudern', '3 × 10'], ['Tuck Lever', '3 × 10 s'], ['Knieheben', '3 × 12'], ['Dead Hang', '2 × 40 s']];
var picked = st.picked || [0, 1, 2];
var rows = picked.map(function (idx) {
return { name: pool[idx][0], dose: pool[idx][1], removeLabel: pool[idx][0] + ' entfernen', remove: function () { self.setState({ picked: picked.filter(function (x) { return x !== idx; }) }); } };
});
var free = [0, 1, 2, 3, 4].filter(function (x) { return picked.indexOf(x) === -1; });
return { accent: accent, glow: glow, rows: rows, canAdd: free.length > 0, summary: 'ca. ' + rows.length * 7 + ' min',
areas: seg([['Push', 'push'], ['Pull', 'pull'], ['Beine', 'legs'], ['Core', 'core']], 'area', st.area || 'pull'),
add: function () { if (free.length) self.setState({ picked: picked.concat([free[0]]) }); } };
}
}
</script>
</body>
</html>
