<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>V2 Journey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#EAF2F5;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090C; color: #EAF2F5; font-family: 'Inter', sans-serif; display: flex; flex-direction: column">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.5px">Journey</h1>
<a href="V2-Fertig.dc.html" aria-label="Training nachtragen" style="width: 44px; height: 44px; border: 1px solid #3A4954; display: flex; align-items: center; justify-content: center; color: #EAF2F5"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>

<div style="border: 1px solid #1E2A33; background: #0B1015; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 17px; font-weight: 600">Diese Woche</div><div style="font-size: 15px; color: {{accent}}">2 von 3</div></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{d.border}}; background: {{d.bg}}"></div>
<div style="font-size: 12px; color: {{d.tone}}">{{d.name}}</div>
</div>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #1E2A33; background: #0B1015">
<div style="padding: 14px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #1E2A33"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">18</div><div style="font-size: 13px; color: #9FB0BC">Trainings</div></div>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #1E2A33"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">9 h</div><div style="font-size: 13px; color: #9FB0BC">trainiert</div></div>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 2px"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: {{accent}}">5</div><div style="font-size: 13px; color: #9FB0BC">Rekorde</div></div>
</div>

<a href="V2-Erfolge.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid #1E2A33; background: #0B1015">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="9" r="5"></circle><path d="M9 13.5L7.5 21l4.5-2.5 4.5 2.5-1.5-7.5"></path></svg>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 16px; font-weight: 600">Erfolge</div><div style="font-size: 14px; color: #9FB0BC">4 von 12</div></div>
<div style="height: 5px; background: #1E2A33"><div style="width: 33%; height: 5px; background: {{accent}}"></div></div>
</div>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9FB0BC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Letzte Trainings</h2>
<sc-for list="{{entries}}" as="e" hint-placeholder-count="4">
<a href="V2-Fertig.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid #1E2A33">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#EAF2F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="{{e.hx}}" cy="{{e.hy}}" r="4"></circle><path d="{{e.pose}}"></path></svg>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><div style="font-size: 16px; font-weight: 600">{{e.name}}</div><div style="font-size: 13px; color: #9FB0BC">{{e.when}}</div></div>
<sc-if value="{{e.record}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; font-weight: 600; color: {{accent}}">Rekord</div></sc-if>
</a>
</sc-for>
</div>

</div>

<nav aria-label="Hauptnavigation" style="height: 76px; flex-shrink: 0; box-sizing: border-box; border-top: 1px solid #1E2A33; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 12px 12px">
<a href="V2-Ich.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; font-size: 12px; font-weight: 500; color: #9FB0BC"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Ich</a>
<a href="V2-Workouts.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; font-size: 12px; font-weight: 500; color: #9FB0BC"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M8 6v5a4 4 0 0 0 8 0V6"></path></svg>Workouts</a>
<a href="V2-Journey.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; font-size: 12px; font-weight: 600; color: {{accent}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="19" r="2"></circle><circle cx="19" cy="5" r="2"></circle><path d="M7 19h7a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h7"></path></svg>Journey</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#5CE1FF","#FFB547","#FF7566","#FF7AB8","#A995FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var accent = this.props.accent ?? '#C6F24E';
var trained = [true, false, true, false, false, false, false];
var days = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(function (n, i) {
var today = i === 4;
return { name: n, bg: trained[i] ? accent : 'transparent', border: trained[i] ? accent : (today ? '#EAF2F5' : '#1E2A33'), tone: today ? '#EAF2F5' : '#9FB0BC' };
});
var P = {
core: [9, 26, 'M13 29L41 37M16 30v8h8'],
pull: [24, 14, 'M8 7h32M17 7l5 12M31 7l-5 12M24 19v13M24 32l-4 11M24 32l4 11'],
push: [9, 24, 'M13 27L40 37M16 28v10'],
hand: [24, 38, 'M24 33V5M24 33l-6 10M24 33l6 10']
};
var entries = [
['Pull Day', 'Mi, 11. Nov · 36 min', false, P.pull],
['Push Basics', 'Mo, 9. Nov · 31 min', false, P.push],
['Core & Plank', 'Fr, 6. Nov · 15 min', true, P.core],
['Handstand-Schule', 'Mi, 4. Nov · 24 min', true, P.hand]
].map(function (e) { return { name: e[0], when: e[1], record: e[2], hx: e[3][0], hy: e[3][1], pose: e[3][2] }; });
return { accent: accent, days: days, entries: entries };
}
}
</script>
</body>
</html>
