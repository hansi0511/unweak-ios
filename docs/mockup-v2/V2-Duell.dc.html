<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>V2 Duell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#EAF2F5;text-decoration:none}a:hover{color:#FFFFFF}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090C; color: #EAF2F5; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between"><a href="V2-Liga.dc.html" aria-label="Zurück zur Liga" style="width: 44px; height: 44px; border: 1px solid #1E2A33; background: #0B1015; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a><div style="font-size: 14px; color: #9FB0BC">Noch 2 Tage</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.05">Duell</h1><div style="font-size: 16px; color: #C3CED6">Wer trainiert diese Woche öfter?</div></div>
<div style="position: relative; border: 1px solid #1E2A33; background-color: #0B1015; background-image: linear-gradient(#111920 1px, transparent 1px), linear-gradient(90deg, #111920 1px, transparent 1px); background-size: 24px 24px; padding: 18px 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg aria-hidden="true" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; width: 100px; height: 100px; flex-shrink: 0; filter: drop-shadow(0 0 6px {{glow}})">
<path d="{{me.fillD}}" fill="{{me.fg}}" fill-opacity="{{me.fillOp}}" stroke="none"></path>
<path d="{{me.lines}}" stroke="{{me.fg}}" stroke-width="{{me.w}}"></path>
<circle cx="{{me.hx}}" cy="{{me.hy}}" r="{{me.r}}" fill="#0B1015" stroke="{{me.fg}}" stroke-width="{{me.w}}"></circle>
<path d="{{me.solid}}" fill="{{me.fg}}" stroke="none"></path>
<path d="{{me.exFill}}" fill="{{me.exColor}}" stroke="none"></path>
<path d="{{me.exLine}}" stroke="{{me.exColor}}" stroke-width="{{me.exW}}"></path>
</svg><div style="font-size: 15px; font-weight: 700; color: {{accent}}">Du</div><div style="font-family: 'Space Grotesk', sans-serif; font-size: 48px; font-weight: 700; line-height: 1; color: {{accent}}">3</div></div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #9FB0BC">VS</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg aria-hidden="true" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; width: 100px; height: 100px; flex-shrink: 0; transform: scaleX(-1)">
<path d="{{rival.fillD}}" fill="{{rival.fg}}" fill-opacity="{{rival.fillOp}}" stroke="none"></path>
<path d="{{rival.lines}}" stroke="{{rival.fg}}" stroke-width="{{rival.w}}"></path>
<circle cx="{{rival.hx}}" cy="{{rival.hy}}" r="{{rival.r}}" fill="#0B1015" stroke="{{rival.fg}}" stroke-width="{{rival.w}}"></circle>
<path d="{{rival.solid}}" fill="{{rival.fg}}" stroke="none"></path>
<path d="{{rival.exFill}}" fill="{{rival.exColor}}" stroke="none"></path>
<path d="{{rival.exLine}}" stroke="{{rival.exColor}}" stroke-width="{{rival.exW}}"></path>
</svg><div style="font-size: 15px; font-weight: 600">mara_moves</div><div style="font-family: 'Space Grotesk', sans-serif; font-size: 48px; font-weight: 700; line-height: 1">2</div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 70px; font-size: 13px; color: #9FB0BC">Du</div><div style="flex-grow: 1"><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px"><sc-for list="{{meDays}}" as="d" hint-placeholder-count="7"><div style="height: 10px; background: {{d.c}}"></div></sc-for></div></div></div>
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 70px; font-size: 13px; color: #9FB0BC">mara</div><div style="flex-grow: 1"><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px"><sc-for list="{{rivalDays}}" as="d" hint-placeholder-count="7"><div style="height: 10px; background: {{d.c}}"></div></sc-for></div></div></div>
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 70px"></div><div style="flex-grow: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; color: #9FB0BC; text-align: center"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div></div>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #1E2A33"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFD36B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="9" r="5"></circle><path d="M9 13.5L7.5 21l4.5-2.5 4.5 2.5-1.5-7.5"></path></svg><div style="font-size: 15px">Gewinn: Abzeichen „Duellsieger“</div></div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<a href="V2-Training.dc.html" style="height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 10px; background: {{accent}}; color: #07090C; box-shadow: 0 0 24px {{glow}}; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Training starten</a>
<a href="V2-Herausfordern.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #C3CED6">Neues Duell starten</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#5CE1FF","#FFB547","#FF7566","#FF7AB8","#A995FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

renderVals() {
var accent = this.props.accent ?? '#C6F24E';
var glow = /^#[0-9a-fA-F]{6}$/.test(accent) ? accent + '66' : accent;
var self = this;
var st = this.state || {};

var BODY = {
start: { hx: 50, hy: 24, r: 6.5, w: 3, lines: 'M50 30.5V63M50 38L40 55M50 38L60 55M50 63L42 88M50 63L58 88', fill: 'M0 0', op: 0, solid: 'M0 0' },
athlete: { hx: 50, hy: 22, r: 7, w: 3.6, lines: 'M50 29V63M42 38H58M42 38L33 22M58 38L67 22M50 63L41 88M50 63L59 88', fill: 'M0 0', op: 0, solid: 'M0 0' },
trained: { hx: 50, hy: 21, r: 8, w: 4.6, lines: 'M50 29V38M36 38L64 38L50 64ZM36 38Q24 36 25 24M64 38Q76 36 75 24M50 64Q38 70 40 89M50 64Q62 70 60 89', fill: 'M36 38L64 38L50 64Z', op: 0.3, solid: 'M21.8 22a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0M71.8 22a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0' }
};
function fig(body, color, extra, exColor) {
var b = BODY[body];
var hx = b.hx, hy = b.hy, r = b.r, x = 'M0 0', xf = 'M0 0', xw = 2.4;
if (extra === 'headband') x = 'M' + (hx - r) + ' ' + (hy - 0.35 * r).toFixed(2) + 'L' + (hx + r) + ' ' + (hy - 0.55 * r).toFixed(2) + 'l6 ' + (0.45 * r).toFixed(2);
if (extra === 'visor') { x = 'M' + (hx - r - 0.5) + ' ' + (hy - 0.5) + 'H' + (hx + r + 0.5); xw = 3.2; }
if (extra === 'crown') { var t = hy - r; xf = 'M' + (hx - r) + ' ' + (t - 1.5) + 'L' + (hx - r) + ' ' + (t - 8) + 'L' + (hx - r / 2) + ' ' + (t - 4.5) + 'L' + hx + ' ' + (t - 10) + 'L' + (hx + r / 2) + ' ' + (t - 4.5) + 'L' + (hx + r) + ' ' + (t - 8) + 'L' + (hx + r) + ' ' + (t - 1.5) + 'Z'; }
if (extra === 'cap') { var R = r + 1.2; xf = 'M' + (hx - R) + ' ' + hy + 'A' + R + ' ' + R + ' 0 0 1 ' + (hx + R) + ' ' + hy + 'Z'; x = 'M' + hx + ' ' + (hy - 0.15 * r).toFixed(2) + 'H' + (hx + r + 6); xw = 2.6; }
return { fg: color, w: b.w, hx: hx, hy: hy, r: r, lines: b.lines, fillD: b.fill, fillOp: b.op, solid: b.solid, exLine: x, exFill: xf, exW: xw, exColor: exColor || '#EAF2F5' };
}
var me = [1, 0, 1, 0, 1, 0, 0], ri = [0, 1, 0, 1, 0, 0, 0];
function days(arr, col) { return arr.map(function (v, i) { return { c: v ? col : (i > 4 ? '#111920' : '#1E2A33') }; }); }
return { accent: accent, glow: glow, me: fig('athlete', accent, 'headband', '#5CE1FF'), rival: fig('trained', '#FF7AB8', 'headband', '#EAF2F5'), meDays: days(me, accent), rivalDays: days(ri, '#FF7AB8') };
}
}
</script>
</body>
</html>
