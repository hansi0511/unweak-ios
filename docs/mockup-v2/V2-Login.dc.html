<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>V2 Anmeldung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#EAF2F5;text-decoration:none}a:hover{color:#FFFFFF}
@keyframes fl-lift{0%,18%{transform:rotate(0deg)}42%,80%{transform:rotate(-90deg)}100%{transform:rotate(0deg)}}
.fl-body{transform-box:view-box;transform-origin:60px 62px;animation:fl-lift 6s cubic-bezier(.6,0,.3,1) infinite}
@media (prefers-reduced-motion: reduce){.fl-body{animation:none;transform:rotate(-90deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090C; color: #EAF2F5; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px">
<div style="display: flex; justify-content: flex-end"><div style="width: 112px">
<div role="group" aria-label="Sprache" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #3A4954">
<sc-for list="{{langs}}" as="m" hint-placeholder-count="2"><button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="height: 44px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{m.name}}</button></sc-for>
</div></div></div>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<svg role="img" aria-label="Animation: Sticky Man im Front Lever" width="290" height="290" viewBox="0 0 160 160" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 12px {{glow}})">
<path d="M16 8v16h128V8" stroke="#EAF2F5" stroke-width="3"></path>
<path d="M55 24l5 38M65 24l-5 38" stroke="{{accent}}" stroke-width="4"></path>
<g class="fl-body" stroke="{{accent}}" stroke-width="5"><circle cx="60" cy="47" r="8" fill="#07090C"></circle><path d="M60 62v88"></path></g>
</svg>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 56px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.05">Unweak</h1><div style="font-size: 18px; color: #C3CED6">Progress from week to week.</div></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<a href="V2-Ich.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; background: #EAF2F5; color: #07090C; font-size: 17px; font-weight: 600">Mit Apple anmelden</a>
<a href="V2-Ich.dc.html" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid #EAF2F5; font-size: 17px; font-weight: 600">Mit Google anmelden</a>
<div style="font-size: 12px; color: #9FB0BC; text-align: center"><a href="#" style="color: #C3CED6; text-decoration: underline">Nutzungsbedingungen</a> · <a href="#" style="color: #C3CED6; text-decoration: underline">Datenschutz</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#5CE1FF","#FFB547","#FF7566","#FF7AB8","#A995FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'de' }; }
renderVals() {
var accent = this.props.accent ?? '#C6F24E';
var glow = /^#[0-9a-fA-F]{6}$/.test(accent) ? accent + '66' : accent;
var self = this;
var st = this.state || {};
function seg(list, key, cur) {
return list.map(function (m) {
var on = m[1] === cur;
return { name: m[0], pressed: on ? 'true' : 'false', bg: on ? accent : 'transparent', fg: on ? '#07090C' : '#EAF2F5', pick: function () { var o = {}; o[key] = m[1]; self.setState(o); } };
});
}
return { accent: accent, glow: glow, langs: seg([['DE', 'de'], ['EN', 'en']], 'lang', st.lang || 'de') };
}
}
</script>
</body>
</html>
