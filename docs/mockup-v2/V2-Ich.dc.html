<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#5CE1FF","#FFB547","#FF7566","#FF7AB8","#A995FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var accent = this.props.accent ?? '#C6F24E';
var glow = /^#[0-9a-fA-F]{6}$/.test(accent) ? accent + '66' : accent;
function arc(cx, cy, R, a0, a1) {
var r0 = (a0 - 90) * Math.PI / 180, r1 = (a1 - 90) * Math.PI / 180;
return 'M' + (cx + R * Math.cos(r0)).toFixed(2) + ' ' + (cy + R * Math.sin(r0)).toFixed(2) + 'A' + R + ' ' + R + ' 0 0 1 ' + (cx + R * Math.cos(r1)).toFixed(2) + ' ' + (cy + R * Math.sin(r1)).toFixed(2);
}
var ringDone = '', ringOpen = '';
for (var i = 0; i < 3; i++) { var d = arc(95, 95, 91, i * 120 + 3, (i + 1) * 120 - 3); if (i < 2) ringDone += d; else ringOpen += d; }
return { accent: accent, glow: glow, ringDone: ringDone, ringOpen: ringOpen };
}
}
</script>
