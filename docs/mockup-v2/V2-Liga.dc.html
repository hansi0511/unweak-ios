<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>V2 Liga</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#EAF2F5;text-decoration:none}a:hover{color:#FFFFFF}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090C; color: #EAF2F5; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between"><a href="V2-Ich.dc.html" aria-label="Zurück zu Ich" style="width: 44px; height: 44px; border: 1px solid #1E2A33; background: #0B1015; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<a href="V2-Punkte.dc.html" aria-label="So sammelst du Punkte" style="width: 44px; height: 44px; border: 1px solid #1E2A33; background: #0B1015; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></a></div>
<div style="display: flex; align-items: center; gap: 14px">
<svg aria-hidden="true" width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="#C9D3DB" stroke-width="2.6" stroke-linejoin="round" style="flex-shrink: 0"><path d="M24 4l17 8v12c0 10-7 17-17 20C14 41 7 34 7 24V12z"></path><path d="M16 23l6 6 10-12" stroke-linecap="round"></path></svg>
<div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.05">Silber-Liga</h1><div style="font-size: 15px; color: #C3CED6">Noch 2 Tage · Top 5 steigen auf</div></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #1E2A33; background: #0B1015"><svg aria-hidden="true" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; width: 36px; height: 36px; flex-shrink: 0; ">
<path d="{{prize.fillD}}" fill="{{prize.fg}}" fill-opacity="{{prize.fillOp}}" stroke="none"></path>
<path d="{{prize.lines}}" stroke="{{prize.fg}}" stroke-width="{{prize.w}}"></path>
<circle cx="{{prize.hx}}" cy="{{prize.hy}}" r="{{prize.r}}" fill="#0B1015" stroke="{{prize.fg}}" stroke-width="{{prize.w}}"></circle>
<path d="{{prize.solid}}" fill="{{prize.fg}}" stroke="none"></path>
<path d="{{prize.exFill}}" fill="{{prize.exColor}}" stroke="none"></path>
<path d="{{prize.exLine}}" stroke="{{prize.exColor}}" stroke-width="{{prize.exW}}"></path>
</svg><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 13px; color: #9FB0BC">Platz 1 gewinnt</div><div style="font-size: 14px; font-weight: 600">Silberkrone</div></div></div>
<a href="V2-Duell.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px dashed {{accent}}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 19L19 5M14 5h5v5M19 19L5 5M5 10V5h5"></path></svg><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 13px; color: #9FB0BC">1 laufendes</div><div style="font-size: 14px; font-weight: 600; color: {{accent}}">Duell</div></div></a>
</div>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; margin: 0 -2px; padding: 0 2px">
<sc-for list="{{rows}}" as="u" hint-placeholder-count="20">
<sc-if value="{{u.zoneUp}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; font-weight: 600; color: {{accent}}"><div style="flex-grow: 1; height: 1px; background: {{accent}}"></div>Aufstieg bis hier<div style="flex-grow: 1; height: 1px; background: {{accent}}"></div></div></sc-if>
<sc-if value="{{u.zoneDown}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; font-weight: 600; color: #FF7566"><div style="flex-grow: 1; height: 1px; background: #FF7566"></div>Abstieg ab hier<div style="flex-grow: 1; height: 1px; background: #FF7566"></div></div></sc-if>
<div style="display: flex; align-items: center; gap: 12px; height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 14px 0 10px; border: 1px solid {{u.border}}; background: {{u.bg}}; margin-bottom: 6px">
<div style="width: 26px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: {{u.placeTone}}">{{u.place}}</div>
<svg aria-hidden="true" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; width: 40px; height: 40px; flex-shrink: 0; ">
<path d="{{u.av.fillD}}" fill="{{u.av.fg}}" fill-opacity="{{u.av.fillOp}}" stroke="none"></path>
<path d="{{u.av.lines}}" stroke="{{u.av.fg}}" stroke-width="{{u.av.w}}"></path>
<circle cx="{{u.av.hx}}" cy="{{u.av.hy}}" r="{{u.av.r}}" fill="#0B1015" stroke="{{u.av.fg}}" stroke-width="{{u.av.w}}"></circle>
<path d="{{u.av.solid}}" fill="{{u.av.fg}}" stroke="none"></path>
<path d="{{u.av.exFill}}" fill="{{u.av.exColor}}" stroke="none"></path>
<path d="{{u.av.exLine}}" stroke="{{u.av.exColor}}" stroke-width="{{u.av.exW}}"></path>
</svg>
<div style="flex-grow: 1; min-width: 0; font-size: 16px; font-weight: {{u.weight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{u.name}}</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700">{{u.pts}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#5CE1FF","#FFB547","#FF7566","#FF7AB8","#A995FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

renderVals() {
var accent = this.props.accent ?? '#C6F24E';
var glow = /^#[0-9a-fA-F]{6}$/.test(accent) ? accent + '66' : accent;
var self = this;
var st = this.state || {};

var BODY = {
start: { hx: 50, hy: 24, r: 6.5, w: 3, lines: 'M50 30.5V63M50 38L40 55M50 38L60 55M50 63L42 88M50 63L58 88', fill: 'M0 0', op: 0, solid: 'M0 0' },
athlete: { hx: 50, hy: 22, r: 7, w: 3.6, lines: 'M50 29V63M42 38H58M42 38L33 22M58 38L67 22M50 63L41 88M50 63L59 88', fill: 'M0 0', op: 0, solid: 'M0 0' },
trained: { hx: 50, hy: 21, r: 8, w: 4.6, lines: 'M50 29V38M36 38L64 38L50 64ZM36 38Q24 36 25 24M64 38Q76 36 75 24M50 64Q38 70 40 89M50 64Q62 70 60 89', fill: 'M36 38L64 38L50 64Z', op: 0.3, solid: 'M21.8 22a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0M71.8 22a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0' }
};
function fig(body, color, extra, exColor) {
var b = BODY[body];
var hx = b.hx, hy = b.hy, r = b.r, x = 'M0 0', xf = 'M0 0', xw = 2.4;
if (extra === 'headband') x = 'M' + (hx - r) + ' ' + (hy - 0.35 * r).toFixed(2) + 'L' + (hx + r) + ' ' + (hy - 0.55 * r).toFixed(2) + 'l6 ' + (0.45 * r).toFixed(2);
if (extra === 'visor') { x = 'M' + (hx - r - 0.5) + ' ' + (hy - 0.5) + 'H' + (hx + r + 0.5); xw = 3.2; }
if (extra === 'crown') { var t = hy - r; xf = 'M' + (hx - r) + ' ' + (t - 1.5) + 'L' + (hx - r) + ' ' + (t - 8) + 'L' + (hx - r / 2) + ' ' + (t - 4.5) + 'L' + hx + ' ' + (t - 10) + 'L' + (hx + r / 2) + ' ' + (t - 4.5) + 'L' + (hx + r) + ' ' + (t - 8) + 'L' + (hx + r) + ' ' + (t - 1.5) + 'Z'; }
if (extra === 'cap') { var R = r + 1.2; xf = 'M' + (hx - R) + ' ' + hy + 'A' + R + ' ' + R + ' 0 0 1 ' + (hx + R) + ' ' + hy + 'Z'; x = 'M' + hx + ' ' + (hy - 0.15 * r).toFixed(2) + 'H' + (hx + r + 6); xw = 2.6; }
return { fg: color, w: b.w, hx: hx, hy: hy, r: r, lines: b.lines, fillD: b.fill, fillOp: b.op, solid: b.solid, exLine: x, exFill: xf, exW: xw, exColor: exColor || '#EAF2F5' };
}

var people = [
['k.lever', 212, 'trained', '#5CE1FF', 'visor', '#EAF2F5'], ['mara_moves', 186, 'trained', '#FF7AB8', 'headband', '#EAF2F5'], ['bar.joe', 171, 'athlete', '#FFB547', 'cap', '#EAF2F5'],
['Du', 158, 'athlete', accent, 'headband', '#5CE1FF'], ['tim.calis', 149, 'athlete', '#A995FF', 'none'], ['nora.fit', 140, 'athlete', '#5CE1FF', 'none'],
['lukas_w', 131, 'athlete', '#FF7566', 'cap', '#EAF2F5'], ['sarah.k', 120, 'start', '#FF7AB8', 'none'], ['ben_moves', 112, 'athlete', '#C6F24E', 'none'],
['ella.str', 104, 'start', '#FFB547', 'headband', '#EAF2F5'], ['jonas.h', 96, 'start', '#A995FF', 'none'], ['mia_lev', 90, 'athlete', '#5CE1FF', 'none'],
['paul.p', 81, 'start', '#EAF2F5', 'none'], ['lena.g', 74, 'start', '#FF7566', 'none'], ['max.bar', 66, 'start', '#C6F24E', 'none'],
['anna_up', 52, 'start', '#FF7AB8', 'none'], ['felix.r', 40, 'start', '#FFB547', 'none'], ['tom.k', 30, 'start', '#A995FF', 'none'],
['julia.m', 20, 'start', '#5CE1FF', 'none'], ['nico_b', 10, 'start', '#EAF2F5', 'none']
];
var rows = people.map(function (p, i) {
var me = p[0] === 'Du';
var place = i + 1;
return {
place: place, name: p[0], pts: p[1], av: fig(p[2], p[3], p[4], p[5]),
zoneUp: place === 6, zoneDown: place === 16,
border: me ? accent : '#1E2A33', bg: me ? '#111920' : '#0B1015', weight: me ? '700' : '500',
placeTone: place <= 5 ? accent : (place >= 16 ? '#FF7566' : '#9FB0BC')
};
});
return { accent: accent, glow: glow, rows: rows, prize: fig('trained', '#C9D3DB', 'crown', '#C9D3DB') };
}
}
</script>
</body>
</html>
