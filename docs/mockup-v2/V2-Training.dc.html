<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>V2 Training</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#EAF2F5;text-decoration:none}a:hover{color:#FFFFFF}
@keyframes pu-body{0%,15%{transform:translateY(0)}32.5%{transform:translateY(-14.2px)}50%,60%{transform:translateY(-28.35px)}77.5%{transform:translateY(-14.2px)}95%,100%{transform:translateY(0)}}
@keyframes pu-fl{0%,15%{transform:rotate(0deg)}32.5%{transform:rotate(40.2deg)}50%,60%{transform:rotate(51.6deg)}77.5%{transform:rotate(40.2deg)}95%,100%{transform:rotate(0deg)}}
@keyframes pu-fr{0%,15%{transform:rotate(0deg)}32.5%{transform:rotate(-40.2deg)}50%,60%{transform:rotate(-51.6deg)}77.5%{transform:rotate(-40.2deg)}95%,100%{transform:rotate(0deg)}}
@keyframes pu-ul{0%,15%{transform:rotate(0deg)}32.5%{transform:rotate(-47.4deg)}50%,60%{transform:rotate(-75.1deg)}77.5%{transform:rotate(-47.4deg)}95%,100%{transform:rotate(0deg)}}
@keyframes pu-ur{0%,15%{transform:rotate(0deg)}32.5%{transform:rotate(47.4deg)}50%,60%{transform:rotate(75.1deg)}77.5%{transform:rotate(47.4deg)}95%,100%{transform:rotate(0deg)}}
.pu{transform-box:view-box;animation-duration:3s;animation-timing-function:linear;animation-iteration-count:infinite}
.pu-body{animation-name:pu-body}
.pu-fl{transform-origin:80px 20px;animation-name:pu-fl}
.pu-fr{transform-origin:120px 20px;animation-name:pu-fr}
.pu-ul{transform-origin:88px 69.35px;animation-name:pu-ul}
.pu-ur{transform-origin:112px 69.35px;animation-name:pu-ur}
@media (prefers-reduced-motion: reduce){.pu{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090C; color: #EAF2F5; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 18px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="V2-Ich.dc.html" aria-label="Training beenden" style="width: 44px; height: 44px; border: 1px solid #1E2A33; background: #0B1015; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div role="img" aria-label="Übung 2 von 4" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px"><div style="height: 5px; background: {{accent}}"></div><div style="height: 5px; background: #EAF2F5"></div><div style="height: 5px; background: #1E2A33"></div><div style="height: 5px; background: #1E2A33"></div></div>
<a href="V2-Uebung.dc.html" aria-label="So geht die Übung" style="width: 44px; height: 44px; border: 1px solid #1E2A33; background: #0B1015; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">?</a>
</div>

<h1 style="margin: 0; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.8px">Klimmzüge</h1>

<div style="flex-grow: 1; min-height: 0; display: flex; align-items: center; justify-content: center">
<svg role="img" aria-label="Animation: Klimmzüge" width="290" height="246" viewBox="0 0 200 170" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 10px {{glow}})">
<path d="M30 6v14h140V6" stroke="#EAF2F5" stroke-width="3"></path>
<path class="pu pu-fl" d="M80 20L84 44.7" stroke="{{accent}}" stroke-width="5"></path>
<path class="pu pu-fr" d="M120 20L116 44.7" stroke="{{accent}}" stroke-width="5"></path>
<g class="pu pu-body" stroke="{{accent}}" stroke-width="5">
<path class="pu pu-ul" d="M88 69.35L84 44.7"></path>
<path class="pu pu-ur" d="M112 69.35L116 44.7"></path>
<path d="M88 69.35h24"></path>
<circle cx="100" cy="55" r="9" fill="#07090C"></circle>
<path d="M100 69.35V112"></path>
<path d="M100 112l-6 38M100 112l6 38"></path>
</g>
</svg>
</div>

<sc-if value="{{resting}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; line-height: 1; color: #EAF2F5">1:30</div>
<div style="font-size: 17px; color: #C3CED6">Pause</div>
</div>
</sc-if>
<sc-if value="{{working}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; line-height: 1; color: {{accent}}">6</div>
<div style="font-size: 17px; color: #C3CED6">Wiederholungen</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div role="img" aria-label="{{setsAria}}" style="display: flex; gap: 10px">
<sc-for list="{{sets}}" as="s" hint-placeholder-count="4"><div style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid {{s.border}}; background: {{s.bg}}"></div></sc-for>
</div>
<div style="font-size: 15px; color: #9FB0BC">{{setsText}}</div>
</div>

<sc-if value="{{finished}}" hint-placeholder-val="{{false}}"><a href="V2-Fertig.dc.html" style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #07090C; box-shadow: 0 0 24px {{glow}}; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Training abschließen</a></sc-if>
<sc-if value="{{notFinished}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{tick}}" style="height: 64px; flex-shrink: 0; border: 0; background: {{btnBg}}; color: {{btnFg}}; box-shadow: 0 0 24px {{btnGlow}}; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; cursor: pointer">{{btn}}</button></sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#5CE1FF","#FFB547","#FF7566","#FF7AB8","#A995FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { done: 2, resting: false };
}
renderVals() {
var accent = this.props.accent ?? '#C6F24E';
var glow = /^#[0-9a-fA-F]{6}$/.test(accent) ? accent + '66' : accent;
var self = this;
var st = this.state || {};
var done = typeof st.done === 'number' ? st.done : 2;
var resting = !!st.resting;
var sets = [0, 1, 2, 3].map(function (i) {
return { bg: i < done ? accent : 'transparent', border: i < done ? accent : (i === done ? '#EAF2F5' : '#3A4954') };
});
var finished = done >= 4;
var btn = resting ? 'Pause überspringen' : (finished ? 'Nächste Übung' : 'Satz geschafft');
return {
accent: accent, glow: glow, sets: sets, resting: resting, working: !resting, finished: finished && !resting, notFinished: !(finished && !resting),
setsText: finished ? 'Alle Sätze geschafft' : 'Satz ' + (done + 1) + ' von 4',
setsAria: done + ' von 4 Sätzen geschafft',
btn: btn,
btnBg: resting ? 'transparent' : accent, btnFg: resting ? '#EAF2F5' : '#07090C', btnGlow: resting ? 'transparent' : glow,
tick: function () {
if (resting) { self.setState({ resting: false }); return; }
if (finished) { self.setState({ done: 0, resting: false }); return; }
self.setState({ done: done + 1, resting: done + 1 < 4 });
}
};
}
}
</script>
</body>
</html>
