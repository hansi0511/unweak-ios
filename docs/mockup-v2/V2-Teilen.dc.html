<style>
body{margin:0}
a{color:#EAF2F5;text-decoration:none}a:hover{color:#FFFFFF}
@keyframes pu-body{0%,15%{transform:translateY(0)}32.5%{transform:translateY(-14.2px)}50%,60%{transform:translateY(-28.35px)}77.5%{transform:translateY(-14.2px)}95%,100%{transform:translateY(0)}}

@keyframes pu-fr{0%,15%{transform:rotate(0deg)}32.5%{transform:rotate(-40.2deg)}50%,60%{transform:rotate(-51.6deg)}77.5%{transform:rotate(-40.2deg)}95%,100%{transform:rotate(0deg)}}
@keyframes pu-ul{0%,15%{transform:rotate(0deg)}32.5%{transform:rotate(-47.4deg)}50%,60%{transform:rotate(-75.1deg)}77.5%{transform:rotate(-47.4deg)}95%,100%{transform:rotate(0deg)}}
@keyframes pu-ur{0%,15%{transform:rotate(0deg)}32.5%{transform:rotate(47.4deg)}50%,60%{transform:rotate(75.1deg)}77.5%{transform:rotate(47.4deg)}95%,100%{transform:rotate(0deg)}}
.pu{transform-box:view-box;animation-duration:3s;animation-timing-function:linear;animation-iteration-count:infinite}
.pu-body{animation-name:pu-body}
.pu-fl{transform-origin:80px 20px;animation-name:pu-fl}
.pu-fr{transform-origin:120px 20px;animation-name:pu-fr}
.pu-ul{transform-origin:88px 69.35px;animation-name:pu-ul}
.pu-ur{transform-origin:112px 69.35px;animation-name:pu-ur}

<path class="pu pu-fr" d="M120 20L116 44.7" stroke="{{accent}}" stroke-width="5"></path>

</div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#5CE1FF","#FFB547","#FF7566","#FF7AB8","#A995FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { kind: 'video' }; }
renderVals() {
var accent = this.props.accent ?? '#C6F24E';
var glow = /^#[0-9a-fA-F]{6}$/.test(accent) ? accent + '66' : accent;
var self = this;
var st = this.state || {};
function seg(list, key, cur) {
return list.map(function (m) {
var on = m[1] === cur;
return { name: m[0], pressed: on ? 'true' : 'false', bg: on ? accent : 'transparent', fg: on ? '#07090C' : '#EAF2F5', pick: function () { var o = {}; o[key] = m[1]; self.setState(o); } };
});
}
var kind = st.kind || 'video';
return { accent: accent, glow: glow, kinds: seg([['Video', 'video'], ['Bild', 'image']], 'kind', kind), motion: kind === 'video' ? 'moving' : 'still' };
}
}
</script>
